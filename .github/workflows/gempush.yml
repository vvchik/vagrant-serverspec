name: Ruby Gem

# Release flow: bump VERSION + CHANGELOG, merge to master, push tag vX.Y.Z.
# Publishes via RubyGems trusted publishing (OIDC) - no API key secret needed.
# One-time setup: https://rubygems.org/gems/vagrant-serverspec/trusted_publishers
#   owner vvchik, repository vagrant-serverspec, workflow gempush.yml, environment Release
# Can also be run by hand (Actions -> Ruby Gem -> Run workflow) for an existing tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v2.0.0)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build + Publish to RubyGems
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write   # rake release pushes the tag; gh creates the GitHub release
      id-token: write   # mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}
        persist-credentials: false

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - run: bundle install --jobs 4

    - name: Run tests
      run: bundle exec rspec

    - name: Check that the tag matches the gem version
      run: |
        version=$(ruby -Ilib -rvagrant-serverspec/version -e 'print VagrantPlugins::ServerSpec::VERSION')
        if [ "v${version}" != "${RELEASE_TAG}" ]; then
          echo "Tag ${RELEASE_TAG} does not match VERSION ${version}" >&2
          exit 1
        fi

    - uses: rubygems/release-gem@v1

    - name: Create GitHub release (or attach the gem to an existing one)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
          gh release upload "${RELEASE_TAG}" pkg/*.gem --clobber
        else
          gh release create "${RELEASE_TAG}" pkg/*.gem \
            --title "${RELEASE_TAG}" \
            --notes "See CHANGELOG.md: https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md" \
            --verify-tag
        fi
