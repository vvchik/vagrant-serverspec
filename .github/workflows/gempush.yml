name: Ruby Gem

# Release flow: bump VERSION + CHANGELOG, merge to master, push tag vX.Y.Z.
# Publishes via RubyGems trusted publishing (OIDC) - no API key secret needed.
# One-time setup: https://rubygems.org/gems/vagrant-serverspec/trusted_publishers
#   owner vvchik, repository vagrant-serverspec, workflow gempush.yml, environment release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build + Publish to RubyGems
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # rake release pushes the tag; gh creates the GitHub release
      id-token: write   # mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - run: bundle install --jobs 4

    - name: Run tests
      run: bundle exec rspec

    - name: Check that the tag matches the gem version
      run: |
        version=$(ruby -Ilib -rvagrant-serverspec/version -e 'print VagrantPlugins::ServerSpec::VERSION')
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
          exit 1
        fi

    - uses: rubygems/release-gem@v1

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" pkg/*.gem \
          --title "${GITHUB_REF_NAME}" \
          --notes "See CHANGELOG.md: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md" \
          --verify-tag
