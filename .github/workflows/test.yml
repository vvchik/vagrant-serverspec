name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  rspec:
    name: RSpec (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vagrant 2.4.x supports Ruby 3.0 - 3.4
        ruby: ['3.1', '3.2', '3.3', '3.4']

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      # Gemfile.lock is not committed (this is a gem), so no bundler-cache here.
      - run: bundle install --jobs 4

      - name: Run unit tests
        run: bundle exec rspec

      - name: Build gem
        run: gem build vagrant-serverspec.gemspec

      - name: Install as a Vagrant plugin and validate sample Vagrantfile
        env:
          VAGRANT_CHECKPOINT_DISABLE: '1'
        run: |
          export VAGRANT_HOME="$RUNNER_TEMP/vagrant_home"
          bundle exec vagrant plugin install ./vagrant-serverspec-*.gem
          bundle exec vagrant plugin list
          cd test/ubuntu
          bundle exec vagrant validate --ignore-provider

  audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: bundle install --jobs 4
      - run: gem install bundler-audit --no-document
      # Vagrant itself pins rubyzip ~> 2.3.2; that advisory is not ours to fix.
      - run: bundle-audit check --update --ignore CVE-2026-85396
